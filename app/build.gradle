plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cytv.ecard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cytv.ecard'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // sideloaded only: sign with the debug key so it installs anywhere
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
